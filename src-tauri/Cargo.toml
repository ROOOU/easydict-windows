[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "form", "query", "charset", "system-proxy", "gzip", "brotli", "deflate"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
sha2 = "0.11.1"
sha1 = "0.11.0"
md-5 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = "0.4.45"
anyhow = "1.0.104"
thiserror = "2.0.21"
regex = "1.13.1"
unicode-segmentation = "1.13.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
futures-util = { version = "0.3.34", features = ["std"] }
bytes = "1"
aes = "0.9.3"
cbc = "0.2.1"
block-padding = "0.4.2"
rand = "0.10.3"
once_cell = "1.21.4"
parking_lot = "0.12.5"
unicode-normalization = "0.1.25"
tokio-util = { version = "0.7.20", features = ["codec"] }
async-trait = "0.1.92"
num-traits = "0.2.19"
log = "0.4"
dirs = "6"
arboard = { version = "3", features = ["image-data"] }

# Windows platform APIs: OCR (`Windows.Media.Ocr`), the system speech
# synthesiser, media playback for TTS audio, and GDI screen capture. These
# replace the macOS Vision / NSSpeechSynthesizer / CGWindowListCreateImage
# stack that the upstream app is built on.
[target.'cfg(windows)'.dependencies]
# Suspending a hidden window's WebView (`ICoreWebView2_3`) and lowering its
# memory target level (`ICoreWebView2_19`). Tauri hands out its own
# `webview2-com` controller, so this pins the version Tauri already resolves
# rather than adding a second copy of the bindings.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Core",
    "Media_Ocr",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_StationsAndDesktops"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
